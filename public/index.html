<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The arena</title>
  <meta name="description" content="A top-down arena that never closes: drag back, let go, and fight strangers for what's on the floor.">
  <meta name="theme-color" content="#16130f">
  <link rel="stylesheet" href="/arena.css">
  <script type="module" src="/arena-app.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="status" data-status role="status" hidden></p>
    <div class="field">
      <canvas class="arena" data-arena tabindex="0" aria-describedby="how" aria-label="The arena, from above. Your robot has the white ring."></canvas>
      <p class="toast" data-toast role="status" hidden></p>
      <div class="corner">
        <a class="roomlink" href="/room/" data-room-link>Room <span class="count" data-banked data-none>0</span></a>
        <button class="sound" type="button" data-sound aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="hush" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <details class="how">
          <summary aria-label="How to play">?</summary>
          <div class="howcard">
            <p id="how">Drag back anywhere and let go to launch, even in mid-flight. Touching anyone scatters everything you both carry. Only what reaches the vault is yours for good. Keys: arrows aim, Enter launches, Escape cancels.</p>
            <p><a href="/readme/">About the arena</a></p>
          </div>
        </details>
      </div>
    </div>
    <div class="pad" data-pad aria-hidden="true">Drag here</div>
    <p class="sr" data-coach role="status"></p>
    <noscript><p class="status">The arena needs JavaScript.</p></noscript>
  </main>
</body>
</html>
